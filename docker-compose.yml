version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: photofinder_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-photofinder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-photofinder}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - photofinder_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photofinder_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-photofinder}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./backend/app:/app/app
      - backend_storage:/app/storage_data
    networks:
      - photofinder_network

volumes:
  postgres_data:
    name: photofinder_postgres_data
  backend_storage:
    name: photofinder_backend_storage

networks:
  photofinder_network:
    name: photofinder_network
